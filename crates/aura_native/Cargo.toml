[package]
name = "aura_native"
version = "0.3.0"
edition = "2021"
description = "Optional native acceleration for the Aura connector (CRC32 + fixed-dimension f32 vector packing)."
license = "Apache-2.0"
publish = false

[lib]
name = "aura_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
crc32fast = "1.4"
