# Local database services for running Aura Connector's optional backend integration tests.
#
#   docker compose -f docker-compose.backends.yml up -d
#   export AURA_TEST_POSTGRES_DSN=postgresql://postgres:postgres@localhost:5432/aura_test
#   export AURA_TEST_MYSQL_DSN=mysql://root:password@localhost:3306/aura_test
#   export AURA_TEST_MONGODB_DSN=mongodb://localhost:27017/aura_test
#   export AURA_TEST_REDIS_DSN=redis://localhost:6379/0
#   python -m pip install -e ".[dev,all-db]"
#   python -m pytest tests/integration -vv
#   docker compose -f docker-compose.backends.yml down -v
#
# SQLite needs no service — it is local and always available.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aura_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: aura_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
